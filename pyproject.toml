[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmfig"
version = "0.1.0"
description = "Approval-gated scientific figure assembly for Adobe Illustrator"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
vision = ["openai>=1.0"]

[project.scripts]
pharmfig = "pharmfig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
